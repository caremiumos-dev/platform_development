[package]
name = "cargo_embargo"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4.4.6", features = ["derive", "error-context", "help", "std", "usage"], default-features = false }
env_logger = { version = "0.10", default-features = false }
glob = "0.3"
log = "0.4"
nix = { version = "0.28.0", features = ["fs"], default-features = false }
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
